name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag at the current main commit
        required: true
        type: string
      skip_npm_test_gate:
        description: Skip the npm test gate for an explicitly authorized emergency release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      NPM_CONFIG_REGISTRY: https://packagefeedproxy.microsoft.io/npm/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Require exact current main tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Release tag must use the expected version format."
          }
          git fetch origin main --tags
          $tagCommit = git rev-list -n 1 $env:RELEASE_TAG
          $mainCommit = git rev-parse origin/main
          if (-not $tagCommit -or $tagCommit -ne $mainCommit -or $tagCommit -ne (git rev-parse HEAD)) {
            throw "Release tag must identify the exact current origin/main commit."
          }
          if (git status --porcelain) {
            throw "Release checkout is not clean."
          }

      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Install current Copilot CLI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releases = gh api "repos/github/copilot-cli/releases?per_page=1" | ConvertFrom-Json
          $release = $releases | Select-Object -First 1
          if (-not $release) {
            throw "No current Copilot CLI release was returned by GitHub."
          }
          $version = $release.tag_name.TrimStart('v')
          New-Item .copilot-current -ItemType Directory -Force | Out-Null
          gh release download $release.tag_name `
            --repo github/copilot-cli `
            --pattern "*win32-x64*" `
            --dir .copilot-current
          Expand-Archive .copilot-current/copilot-win32-x64.zip -DestinationPath .copilot-current/extracted
          $native = Get-ChildItem .copilot-current/extracted -Filter copilot.exe -Recurse |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $native) {
            throw "Current Copilot native executable was not present in the release archive."
          }
          $packageRoot = Join-Path (Resolve-Path .copilot-current) "packages\win32-x64"
          $packagePath = Join-Path $packageRoot $version
          New-Item $packagePath -ItemType Directory -Force | Out-Null
          tar -xf ".copilot-current/github-copilot-$version-win32-x64.tgz" `
            -C $packagePath `
            --strip-components=1
          & $native --version
          "AFTERBURNER_COPILOT_EXECUTABLE=$native" | Add-Content $env:GITHUB_ENV
          "AFTERBURNER_COPILOT_PACKAGE_ROOTS=$packageRoot" | Add-Content $env:GITHUB_ENV
      - run: npm run check:runtime
      - run: git diff --exit-code -- src internal/runtimepkg/app.js internal/runtimepkg/runtime
      - run: go test ./...
      - if: ${{ !inputs.skip_npm_test_gate }}
        run: npm test
      # -unsafeptr=false: internal/terminal/conpty_windows.go passes the HPCON
      # handle by value to UpdateProcThreadAttribute per Microsoft's documented
      # PROC_THREAD_ATTRIBUTE_PSEUDOCONSOLE contract; go vet's generic
      # unsafe.Pointer(uintptr) heuristic flags this known-safe pattern with
      # no per-line suppression available (golang/go#50134).
      - run: go vet -unsafeptr=false ./...

      - name: Build unsigned release assets
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG
          New-Item artifacts -ItemType Directory -Force | Out-Null
          $env:AFTERBURNER_HOME = Join-Path $env:RUNNER_TEMP "afterburn-package-home"
          go run ./cmd/afterburn extension pack extensions/BlackBox artifacts/black-box.zip
          go run ./cmd/afterburn extension pack extensions/BYOModels artifacts/byo-models.zip
          go run ./cmd/afterburn extension pack extensions/OpenAIServer artifacts/openai-server.zip
          go run ./cmd/afterburn extension pack extensions/SubagentPolicy artifacts/subagent-policy.zip
          foreach ($architecture in @("amd64", "arm64")) {
            $env:GOOS = "windows"
            $env:GOARCH = $architecture
            $directory = Join-Path artifacts "afterburn-windows-$architecture"
            New-Item $directory -ItemType Directory -Force | Out-Null
            $executable = Join-Path $directory "afterburn.exe"
            $archive = Join-Path artifacts "afterburn-windows-$architecture.zip"
            go build -trimpath -ldflags "-s -w -X main.version=$version" `
              -o $executable ./cmd/afterburn
            $stream = [IO.File]::Open($archive, [IO.FileMode]::Create)
            try {
              $zip = [IO.Compression.ZipArchive]::new(
                $stream, [IO.Compression.ZipArchiveMode]::Create, $false)
              try {
                $entry = $zip.CreateEntry("afterburn.exe", [IO.Compression.CompressionLevel]::Optimal)
                $entry.LastWriteTime = [DateTimeOffset]::new(1980, 1, 1, 0, 0, 0, [TimeSpan]::Zero)
                $input = [IO.File]::OpenRead($executable)
                try {
                  $output = $entry.Open()
                  try { $input.CopyTo($output) } finally { $output.Dispose() }
                } finally { $input.Dispose() }
              } finally { $zip.Dispose() }
            } finally { $stream.Dispose() }
          }
          $assetNames = @("afterburn-windows-amd64.zip", "afterburn-windows-arm64.zip")
          $releaseAssets = foreach ($asset in $assetNames) {
            $path = Join-Path artifacts $asset
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            [ordered]@{
              name = $asset
              os = "windows"
              architecture = if ($asset -match "arm64") { "arm64" } else { "amd64" }
              sha256 = $hash
              size = (Get-Item $path).Length
            }
          }
          $builtinArchives = [ordered]@{
            "black-box" = "artifacts/black-box.zip"
            "byo-models" = "artifacts/byo-models.zip"
            "openai-server" = "artifacts/openai-server.zip"
          }
          $releaseBuiltins = foreach ($id in $builtinArchives.Keys) {
            $archive = $builtinArchives[$id]
            $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            [ordered]@{
              id = $id
              name = "$id.zip"
              sha256 = $hash
              size = (Get-Item $archive).Length
            }
          }
          $checksums = foreach ($asset in $releaseAssets) {
            "$($asset.sha256)  $($asset.name)"
          }
          $checksums += foreach ($builtin in $releaseBuiltins) {
            "$($builtin.sha256)  $($builtin.name)"
          }
          $checksums | Set-Content artifacts/checksums.txt -Encoding ascii
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -trimpath -o artifacts/fakecopilot.exe ./internal/testutil/fakecopilot
          Remove-Item Env:GOOS -ErrorAction SilentlyContinue
          Remove-Item Env:GOARCH -ErrorAction SilentlyContinue
          $compatibility = go run ./internal/releaseinfo | ConvertFrom-Json
          [ordered]@{
            # Keep schema 1 so installed updaters can consume this release.
            # Compatibility is additive and validated by newer cores.
            schemaVersion = 1
            repository = "${{ github.repository }}"
            version = $version
            commit = "${{ github.sha }}"
            assets = @($releaseAssets)
            builtins = @($releaseBuiltins)
            compatibility = $compatibility
          } | ConvertTo-Json -Depth 6 | Set-Content artifacts/release-manifest.json -Encoding utf8

      - name: Verify live multi-session extension modal isolation
        shell: pwsh
        env:
          AFTERBURNER_REQUIRE_LIVE_EXTENSION_COMMANDS: "1"
          AFTERBURNER_REQUIRE_RELEASE_PACKAGES: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: node tests/multi-session-extension-modal-conpty.mjs artifacts/afterburn-windows-amd64/afterburn.exe artifacts/multi-session-conpty

      - name: Verify supplemental fake Copilot native modal isolation
        shell: pwsh
        run: node tests/multi-session-extension-modal-conpty.mjs artifacts/afterburn-windows-amd64/afterburn.exe artifacts/fakecopilot.exe artifacts/multi-session-conpty-fake

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-release
          path: |
            artifacts/afterburn-windows-amd64.zip
            artifacts/afterburn-windows-arm64.zip
            artifacts/black-box.zip
            artifacts/byo-models.zip
            artifacts/openai-server.zip
            artifacts/checksums.txt
            artifacts/release-manifest.json
          if-no-files-found: error

  sign-and-publish:
    needs: build
    runs-on: windows-latest
    environment: release-signing
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_REPOSITORY: ${{ github.repository }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: unsigned-release
          path: artifacts

      - name: Verify and sign trusted manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.AFTERBURNER_RELEASE_SIGNING_KEY }}
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne "refs/heads/main") {
            throw "Release signing must run from the protected main branch workflow."
          }
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Release tag must use the expected version format."
          }
          git fetch origin main --tags
          $tagCommit = git rev-list -n 1 $env:RELEASE_TAG
          $mainCommit = git rev-parse origin/main
          if (-not $tagCommit -or $tagCommit -ne $mainCommit -or $mainCommit -ne (git rev-parse HEAD)) {
            throw "Trusted signing checkout or release tag no longer matches origin/main."
          }
          $manifest = Get-Content artifacts/release-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.repository -ne $env:RELEASE_REPOSITORY -or
              $manifest.version -ne $env:RELEASE_TAG -or
              $manifest.commit -ne $tagCommit) {
            throw "Unsigned release manifest identity does not match the trusted release."
          }
          foreach ($asset in @($manifest.assets)) {
            $path = Join-Path artifacts $asset.name
            if (-not (Test-Path $path) -or
                (Get-Item $path).Length -ne $asset.size -or
                (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $asset.sha256) {
              throw "Unsigned release asset does not match its manifest: $($asset.name)"
            }
          }
          foreach ($builtin in @($manifest.builtins)) {
            $path = Join-Path artifacts $builtin.name
            if (-not (Test-Path $path) -or
                (Get-Item $path).Length -ne $builtin.size -or
                (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $builtin.sha256) {
              throw "Unsigned built-in release asset does not match its manifest: $($builtin.name)"
            }
          }
          if (-not $env:RELEASE_SIGNING_KEY) {
            throw "AFTERBURNER_RELEASE_SIGNING_KEY is not configured in the release-signing environment."
          }
          Set-Content artifacts/release-signing-key.txt `
            $env:RELEASE_SIGNING_KEY -Encoding ascii -NoNewline
          try {
            go run ./internal/releasesign/cmd sign `
              artifacts/release-signing-key.txt `
              artifacts/release-manifest.json `
              artifacts/release-manifest.sig
          } finally {
            Remove-Item artifacts/release-signing-key.txt -Force -ErrorAction SilentlyContinue
          }

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:RELEASE_TAG `
            artifacts/afterburn-windows-amd64.zip `
            artifacts/afterburn-windows-arm64.zip `
            artifacts/black-box.zip `
            artifacts/byo-models.zip `
            artifacts/openai-server.zip `
            artifacts/checksums.txt `
            artifacts/release-manifest.json `
            artifacts/release-manifest.sig `
            --repo "${{ github.repository }}" `
            --generate-notes `
            --verify-tag
