name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      NPM_CONFIG_REGISTRY: https://packagefeedproxy.microsoft.io/npm/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reject embedded or committed extension packages
        shell: pwsh
        run: |
          if (Test-Path internal/assets/generated) {
            throw "generated built-in package directory must not exist"
          }
          if (Select-String -Path internal/assets/*.go -Pattern 'go:embed|\.zip' -Quiet) {
            throw "built-in package payloads must not be embedded"
          }
          $trackedArchives = git ls-files '*.zip'
          if ($trackedArchives) {
            throw "extension package archives must not be committed: $trackedArchives"
          }
      - run: npm ci
      - name: Install supported Copilot CLI
        shell: pwsh
        run: |
          npm install --global @github/copilot@1.0.83-3 --no-audit --no-fund
          copilot --version
          $native = Join-Path (npm root --global) "@github\copilot\node_modules\@github\copilot-win32-x64\copilot.exe"
          if (-not (Test-Path -LiteralPath $native)) {
            throw "Pinned Copilot native executable was not installed at $native"
          }
          "AFTERBURNER_COPILOT_EXECUTABLE=$native" | Add-Content $env:GITHUB_ENV
      - name: Verify generated runtime copies are current
        run: npm run check:runtime
      - run: go test ./...
      # -unsafeptr=false: internal/terminal/conpty_windows.go passes the HPCON
      # handle by value to UpdateProcThreadAttribute per Microsoft's documented
      # PROC_THREAD_ATTRIBUTE_PSEUDOCONSOLE contract; go vet's generic
      # unsafe.Pointer(uintptr) heuristic flags this known-safe pattern with
      # no per-line suppression available (golang/go#50134).
      - run: go vet -unsafeptr=false ./...
      - run: npm test
      - name: Validate native ConPTY signal forwarding
        shell: pwsh
        run: |
          New-Item artifacts -ItemType Directory -Force | Out-Null
          go build -o artifacts/afterburn.exe ./cmd/afterburn
          go build -o artifacts/fakecopilot.exe ./internal/testutil/fakecopilot
          node tests/native-signal-conpty.mjs artifacts/afterburn.exe artifacts/fakecopilot.exe
      - name: Validate native modal ConPTY broker
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tests/native-modal-conpty.mjs artifacts/afterburn.exe artifacts/fakecopilot.exe
      - name: Validate live multi-session extension modal isolation
        shell: pwsh
        env:
          AFTERBURNER_REQUIRE_LIVE_EXTENSION_COMMANDS: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: node tests/multi-session-extension-modal-conpty.mjs artifacts/afterburn.exe artifacts/multi-session-conpty
      - name: Validate supplemental fake Copilot native modal isolation
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tests/multi-session-extension-modal-conpty.mjs artifacts/afterburn.exe artifacts/fakecopilot.exe artifacts/multi-session-conpty-fake
      - name: Build Windows binaries
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -trimpath -o artifacts/afterburn-windows-amd64.exe ./cmd/afterburn
          $env:GOARCH = "arm64"
          go build -trimpath -o artifacts/afterburn-windows-arm64.exe ./cmd/afterburn
