name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: go generate ./internal/assets
      - name: Verify generated assets are current
        shell: pwsh
        run: |
          if (git status --short -- internal/assets/generated) {
            git diff -- internal/assets/generated
            throw "Embedded built-in archives are stale. Run 'go generate ./internal/assets'."
          }
      - name: Verify generated runtime copies are current
        run: npm run check:runtime
      - run: go test ./...
      # -unsafeptr=false: internal/terminal/conpty_windows.go passes the HPCON
      # handle by value to UpdateProcThreadAttribute per Microsoft's documented
      # PROC_THREAD_ATTRIBUTE_PSEUDOCONSOLE contract; go vet's generic
      # unsafe.Pointer(uintptr) heuristic flags this known-safe pattern with
      # no per-line suppression available (golang/go#50134).
      - run: go vet -unsafeptr=false ./...
      - run: npm run test:sdk-ui
      - run: npm test
      - name: Validate native ConPTY signal forwarding
        shell: pwsh
        run: |
          New-Item artifacts -ItemType Directory -Force | Out-Null
          go build -o artifacts/afterburn.exe ./cmd/afterburn
          go build -o artifacts/fakecopilot.exe ./internal/testutil/fakecopilot
          node tests/native-signal-conpty.mjs artifacts/afterburn.exe artifacts/fakecopilot.exe
      - name: Validate native modal ConPTY broker
        shell: pwsh
        run: node tests/native-modal-conpty.mjs artifacts/afterburn.exe artifacts/fakecopilot.exe
      - name: Build Windows binaries
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -trimpath -o artifacts/afterburn-windows-amd64.exe ./cmd/afterburn
          $env:GOARCH = "arm64"
          go build -trimpath -o artifacts/afterburn-windows-arm64.exe ./cmd/afterburn
